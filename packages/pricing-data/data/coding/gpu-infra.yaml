version: "1.0"
effectiveDate: "2026-03-01"
source: "AWS EC2 public on-demand list (us-east-1) where known; other SKUs marked as planning assumptions"
currency: USD
description: >
  GPU infrastructure catalog for coding-assistant self-hosted sizing.
  Prefer instance-level pricing (gpus_per_instance × instance) over bare GPU $/hr.
