version: "1.0"
source: "https://huggingface.co/datasets/open-llm-leaderboard/contents"
description: >
  Maps calculator catalog models to quality tiers and Hugging Face repos for Open LLM Leaderboard
  (OLL) scores. Closed APIs use static planning scores aligned to vendor tiers until a public HF eval exists.
equivalenceClasses:
  - id: frontier
    label: Frontier reasoning
    description: Top-tier closed or very large open models (Sonnet 4 class, GPT-4.1, Gemini 2.5 Pro).
    averageMin: 68
    averageMax: 100
  - id: strong-open-70b
    label: Strong open ~70B
    description: Open weights in the Llama 3.3 / Qwen 2.5 72B class on OLL.
    averageMin: 58
    averageMax: 72
  - id: mid-open
    label: Mid open (8B–32B)
    description: Efficient instruct models for many enterprise workloads.
    averageMin: 45
    averageMax: 62
  - id: coder-specialist
    label: Coding specialist
    description: Code-tuned MoE or dense models (Qwen Coder, Codestral-class).
    averageMin: 50
    averageMax: 75
  - id: fast-api
    label: Fast / economical API
    description: Haiku, Flash, mini — lower cost, still capable for high volume.
    averageMin: 40
    averageMax: 58
entries:
